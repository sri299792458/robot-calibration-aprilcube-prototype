schema_version: 1

# The 40 mm cube is modeled directly on the left rigid palm, matching the
# supplied photograph.  The hand-frame-aligned envelope includes the cube,
# the visible double-sided tape footprint, and at least 5 mm placement/model
# allowance on each side of its approximately 50 x 2.5 x 50 mm footprint.
# Cube nominal: center [0.040, -0.033, 0.000] m, size 0.040 m.
# Envelope bounds: X [0.010, 0.070], Y [-0.063, -0.005], Z [-0.030, 0.030] m.
hardware_ready: true
blocking_reasons: []
required_attached_boxes:
  - aprilcube_envelope
attached_boxes:
  - name: aprilcube_envelope
    parent_link: left_rubber_hand
    size_m: [0.060, 0.058, 0.060]
    xyz_m: [0.040, -0.034, 0.000]
    rpy_rad: [0.0, 0.0, 0.0]

