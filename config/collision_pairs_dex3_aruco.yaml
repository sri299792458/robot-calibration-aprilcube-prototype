schema_version: 1

# Palm-frame AABBs are derived from Unitree's official left/right Dex3 collision
# meshes at NVIDIA GR00T WholeBodyControl's middle-close finger posture.
# Every dimension includes 2.5 mm padding on both sides. Both palm boxes also
# contain their complete revision-2 dorsal marker plates. Splitting palm,
# thumb, middle, and index geometry avoids declaring the empty space between
# fingers to be solid. This model is valid only while both physical hands are
# in that fixed middle-close posture.
hardware_ready: true
blocking_reasons: []
required_attached_boxes:
  - left_dex3_marker_palm
  - left_dex3_thumb
  - left_dex3_middle
  - left_dex3_index
  - right_dex3_marker_palm
  - right_dex3_thumb
  - right_dex3_middle
  - right_dex3_index
